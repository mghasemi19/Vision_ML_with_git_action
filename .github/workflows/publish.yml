name: Publish approved container (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  package:
    # Publishing requires a manually initiated run on the protected main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Validate and generate model artifact
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          ruff check src tests scripts
          python -m pytest -q
          python -m vision_mlops.pipeline --output-dir models
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare lower-case image repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable-SHA-tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
