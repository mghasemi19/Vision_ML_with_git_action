name: CV model CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Static checks
        run: ruff check src tests scripts
      - name: Unit, data, model and API tests
        run: python -m pytest -q
      - name: Train candidate and enforce model quality gate
        run: python -m vision_mlops.pipeline --output-dir models
      - name: Generate evaluation plots
        run: python scripts/plot_report.py
      - name: Upload auditable model/evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-${{ github.run_id }}
          path: |
            models/metrics.json
            models/model.joblib
            reports/*.png
          if-no-files-found: warn
          retention-days: 14

  docker-smoke:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-evaluation-${{ github.run_id }}
          path: .
      - name: Build quality-gated image
        run: docker build -t vision-mlops:ci .
      - name: Start inference service
        run: docker run -d --name digit-api -p 127.0.0.1:8000:8000 vision-mlops:ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke-test dependencies
        run: pip install httpx==0.28.1 scikit-learn==1.8.0
      - name: Wait for readiness and run predictions
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null; then break; fi
            sleep 2
          done
          python scripts/smoke_test.py
      - name: Print logs on failure
        if: failure()
        run: docker logs digit-api
